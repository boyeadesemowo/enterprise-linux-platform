---
- name: Enterprise Linux Security Compliance Validation
  hosts: linux_servers
  become: true
  gather_facts: true

  tasks:

    - name: Check SELinux
      ansible.builtin.command: getenforce
      register: selinux_check
      changed_when: false

    - name: Check SSH root login
      ansible.builtin.shell: |
        set -o pipefail
        sshd -T | grep '^permitrootlogin '
      args:
        executable: /bin/bash
      register: root_login_check
      changed_when: false


    - name: Check SSH authentication attempts
      ansible.builtin.shell: |
        set -o pipefail
        sshd -T | grep '^maxauthtries '
      args:
        executable: /bin/bash
      register: max_auth_check
      changed_when: false

    - name: Check firewalld
      ansible.builtin.command: firewall-cmd --state
      register: firewall_check
      changed_when: false


    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check security audit rules
      ansible.builtin.command: auditctl -l
      register: audit_rules_check
      changed_when: false

    - name: Validate security baseline
      ansible.builtin.assert:
        that:
          - selinux_check.stdout == "Enforcing"
          - "'permitrootlogin no' in root_login_check.stdout"
          - "'maxauthtries 3' in max_auth_check.stdout"
          - firewall_check.stdout == "running"
          - ansible_facts.services['auditd.service'].state == "running"
          - "'ssh_config' in audit_rules_check.stdout"
          - "'privileged' in audit_rules_check.stdout"
          - "'identity' in audit_rules_check.stdout"
        success_msg: "SECURITY COMPLIANCE: PASS - {{ inventory_hostname }}"
        fail_msg: "SECURITY COMPLIANCE: FAIL - {{ inventory_hostname }}"
