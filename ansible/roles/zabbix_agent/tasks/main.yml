---
# tasks file for roles/zabbix_agent
#
# ---
- name: Install Zabbix 6.4 repository
  ansible.builtin.dnf:
    name: https://repo.zabbix.com/zabbix/6.4/rhel/8/x86_64/zabbix-release-latest.el8.noarch.rpm
    state: present
    disable_gpg_check: true

- name: Install Zabbix Agent 2
  ansible.builtin.dnf:
    name: zabbix-agent2
    state: present


- name: Deploy Zabbix Agent 2 configuration
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Zabbix Agent 2

- name: Ensure Zabbix Agent 2 is enabled and running
  ansible.builtin.service:
    name: zabbix-agent2
    state: started
    enabled: true

- name: Allow Zabbix Agent through firewalld
  ansible.posix.firewalld:
    port: 10050/tcp
    permanent: true
    immediate: true
    state: enabled
