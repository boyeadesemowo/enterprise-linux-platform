---
# ============================================================
# Enterprise Linux Security Hardening
# ============================================================

- name: Harden SSH - disable direct root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin\s+'
    line: 'PermitRootLogin no'
    backup: true
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload sshd

- name: Harden SSH - limit authentication attempts
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries\s+'
    line: 'MaxAuthTries 3'
    backup: true
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reload sshd

# ============================================================
# Zabbix Agent Firewall Hardening
# ============================================================

- name: Allow Zabbix server to access agent port 10050
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="192.168.1.53/32" port port="10050" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled

- name: Remove unrestricted Zabbix agent port 10050
  ansible.posix.firewalld:
    port: 10050/tcp
    permanent: true
    immediate: true
    state: disabled

# ============================================================
# Auditd Security Monitoring
# ============================================================

- name: Ensure audit package is installed
  ansible.builtin.dnf:
    name: audit
    state: present

- name: Ensure auditd is enabled and running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Deploy enterprise security audit rules
  ansible.builtin.copy:
    src: 99-enterprise-security.rules
    dest: /etc/audit/rules.d/99-enterprise-security.rules
    owner: root
    group: root
    mode: '0600'
  register: audit_rules

- name: Load audit rules
  ansible.builtin.command:
    cmd: augenrules --load
  when: audit_rules.changed
